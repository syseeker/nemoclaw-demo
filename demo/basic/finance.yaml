#
# Yahoo Finance, Google Finance, and common financial data APIs for stock prices.

preset:
  name: finance
  description: "Yahoo Finance, Google Finance, and financial data APIs for stock prices"

network_policies:
  finance:
    name: finance
    endpoints:
      # Yahoo Finance
      - host: query1.finance.yahoo.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: query2.finance.yahoo.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: finance.yahoo.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      # Google Finance
      - host: www.google.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: google.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    # No binaries restriction — allow any process (curl, python, node, etc.)
